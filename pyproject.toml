[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "Assistant personnel vocal, 100 % local."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "psutil>=6",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Briques mesurées par le diagnostic J0 (voix, transcription, mot de réveil).
voix = [
    "faster-whisper>=1.2",
    "piper-tts>=1.3",
    "kokoro-onnx>=0.4",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "jiwer>=3.1",
]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.diagnostic" = ["donnees/*.json", "donnees/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lent: test qui télécharge ou charge un vrai modèle (désactivé par défaut, activer avec -m lent)",
]
addopts = "-m 'not lent'"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Règles retenues : erreurs, style de base, bogues probables, modernisation, imports triés.
select = ["E", "F", "W", "B", "UP", "I"]
