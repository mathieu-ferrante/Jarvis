[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "Assistant personnel vocal, 100 % local."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "psutil>=6",
    "httpx>=0.28",
    "cryptography>=43",
]

[project.optional-dependencies]
# Chaîne vocale (et briques mesurées par le diagnostic J0).
voix = [
    "faster-whisper>=1.2",
    "onnx-asr>=0.12",
    "piper-tts>=1.3",
    "kokoro-onnx>=0.4",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "scipy>=1.14",
    "jiwer>=3.1",
]
# Application complète : interface web, présence sur le bureau, outils.
app = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "python-multipart>=0.0.12",
    "pystray>=0.19",
    "pillow>=11",
    "mss>=9",
    "pynput>=1.7",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "beautifulsoup4>=4.12",
    "pypdf>=5",
    "icalendar>=6",
]
# Agent macOS (lot J14) : barre des menus, raccourci, micro
mac = [
    "websockets>=13",
    "rumps>=0.4; sys_platform == 'darwin'",
    "pynput>=1.7",
    "sounddevice>=0.5",
    "soundfile>=0.13",
]
# Automatisation du navigateur (OUT-WEB) : utilise Microsoft Edge déjà installé, sans téléchargement.
navigateur = ["playwright>=1.48"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.diagnostic" = ["donnees/*.json", "donnees/*.txt"]
"jarvis" = ["donnees/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lent: test qui télécharge ou charge un vrai modèle (désactivé par défaut, activer avec -m lent)",
]
addopts = "-m 'not lent'"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Règles retenues : erreurs, style de base, bogues probables, modernisation, imports triés.
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "E741"]  # lignes de données longues ; « l » pour une ligne de résultat

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header"]
